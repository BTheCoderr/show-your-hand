name: Oval Table Seating QA

on:
  push:
    branches: [fix/oval-seat-layout-20261014]
    paths:
      - "src/**"
      - "mobile/**"
      - ".github/workflows/oval-table-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install web and engine dependencies
        run: npm ci
      - name: Test fixed seat geometry and gameplay
        run: npm test
      - name: Build website
        run: npm run build
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install
      - name: Check native types
        working-directory: mobile
        run: npm run typecheck
      - name: Bundle native iOS
        working-directory: mobile
        run: npx expo export --platform ios --output-dir dist-ios
      - name: Bundle native Android
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-android
