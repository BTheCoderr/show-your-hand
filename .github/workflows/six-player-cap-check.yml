name: Six Player Cap Checks

on:
  push:
    branches: [fix/six-player-maximum-20261014]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked web and game dependencies
        run: npm ci
      - name: Test seat count, clockwise order and online roster
        run: npm test
      - name: Verify server and game engine source are in sync
        run: npm run check:edge-sync
      - name: Build production website
        run: npm run build
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install
      - name: Typecheck mobile code
        working-directory: mobile
        run: npm run typecheck
      - name: Export iOS JavaScript without EAS
        working-directory: mobile
        run: npx expo export --platform ios --output-dir dist-ios
      - name: Export Android JavaScript without EAS
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-android
