name: Show Your Hand Agent Brief

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update one operating issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = '[Agent Ops] Show Your Hand operating brief';
            const [allIssues, prs, runs] = await Promise.all([
              github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 }),
              github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 }),
              github.rest.actions.listWorkflowRunsForRepo({ owner, repo, per_page: 20 })
            ]);
            const current = allIssues.find(i => !i.pull_request && i.title === title);
            const tasks = allIssues.filter(i => !i.pull_request && i.title !== title);
            const failures = runs.data.workflow_runs.filter(r => r.conclusion === 'failure').slice(0, 5);
            const safe = s => String(s || '').replace(/[\r\n]/g, ' ').slice(0, 150);
            const bullets = x => x.length ? x.map(y => '- ' + y).join('\n') : '- None';
            const body = [
              '# Show Your Hand engineering brief', '',
              'Generated: ' + new Date().toISOString(), '',
              'Based on GitHub only. NOT a count of players, app crashes, downloads or sales.', '',
              '## Open PRs', bullets(prs.slice(0, 15).map(p => '#' + p.number + ' ' + safe(p.title) + ' (' + p.html_url + ')')), '',
              '## Product issues', bullets(tasks.slice(0, 15).map(i => '#' + i.number + ' ' + safe(i.title) + ' (' + i.html_url + ')')), '',
              '## Recent CI failures', bullets(failures.map(r => safe(r.name) + ' (' + r.html_url + ')')), '',
              'Founder to review issues, PRs, game parity and releases. No automated merge.', ''
            ].join('\n');
            if (current) await github.rest.issues.update({ owner, repo, issue_number: current.number, body });
            else await github.rest.issues.create({ owner, repo, title, body });
