name: Build Netlify Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "index.html"
      - ".github/workflows/build-netlify-artifact.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Add build marker
        run: |
          cp public/build-version.txt dist/build-version.txt
          echo "Built from $GITHUB_SHA" >> dist/build-version.txt

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: show-your-hand-netlify-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
