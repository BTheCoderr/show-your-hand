name: Show Your Hand - Expo Cloud Build

# A manual-only bridge from GitHub to Expo EAS. No builds on push or PR.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What do you want to run?"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - check_expo_connection
          - build_ios_preview
          - build_ios_production
      confirm:
        description: "For a build, type BUILD_IOS_PREVIEW or BUILD_IOS_PRODUCTION (may spend EAS credits)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Avoid starting concurrent jobs for the same manual workflow/ref.
concurrency:
  group: show-your-hand-eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Show Your Hand native branch
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source_revision.outputs.sha }}
    steps:
      - name: Confirm intentional build request
        if: ${{ inputs.mode == 'build_ios_preview' || inputs.mode == 'build_ios_production' }}
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          case "$MODE" in
            build_ios_preview) EXPECTED=BUILD_IOS_PREVIEW ;;
            build_ios_production) EXPECTED=BUILD_IOS_PRODUCTION ;;
            *) echo "::error::Unsupported build mode"; exit 1 ;;
          esac
          if [ "$CONFIRM" != "$EXPECTED" ]; then
            echo "::error::Build not authorized. Enter $EXPECTED to request this potentially billable EAS build."
            exit 1
          fi

      - name: Check out the mobile development branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-expo-v0
          persist-credentials: false

      - name: Pin source SHA for later build jobs
        id: source_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Verify the existing Expo application identity
        run: |
          node <<'NODE'
          const app = require('./mobile/app.json').expo;
          const expected = {
            owner: 'bferrell514',
            slug: 'show-your-hand-mobile',
            bundleIdentifier: 'com.bthedream.showyourhand',
            projectId: '046d7083-6f3b-4b16-9f22-61894243e100'
          };
          if (app.owner !== expected.owner ||
              app.slug !== expected.slug ||
              app.ios?.bundleIdentifier !== expected.bundleIdentifier ||
              app.extra?.eas?.projectId !== expected.projectId) {
            throw new Error('Wrong Expo project: refusing to build or submit a different app.');
          }
          console.log('Verified Expo project identity (no build started).');
          NODE

      - name: Install shared engine dependencies
        run: npm ci

      - name: Confirm browser and Edge game sources match
        run: npm run check:edge-sync

      - name: Run game, artwork, timer, and storage tests
        run: npm test

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Type-check native iOS app
        working-directory: mobile
        run: npm run typecheck

      - name: Verify native iOS JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform ios --output-dir dist-ios

  check_connection:
    name: Verify Expo login without starting a build
    needs: preflight
    if: ${{ inputs.mode == 'check_expo_connection' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify private Expo token exists
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN missing: add it under GitHub Actions repository secrets first."
            exit 1
          fi

      - name: Check out pinned validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Authenticate with Expo (read-only)
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Confirm the Expo account connection
        working-directory: mobile
        run: eas whoami

  build_preview:
    name: Request optional iOS preview on Expo EAS
    needs: preflight
    if: ${{ inputs.mode == 'build_ios_preview' && inputs.confirm == 'BUILD_IOS_PREVIEW' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Expo token was configured privately
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN. Add it in Repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out pinned validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Authenticate with Expo and install EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Request preview build (not App Store / TestFlight submission)
        working-directory: mobile
        run: eas build --platform ios --profile preview --non-interactive --no-wait

  build_production:
    name: Request signed App Store/TestFlight iOS build on Expo EAS
    needs: preflight
    if: ${{ inputs.mode == 'build_ios_production' && inputs.confirm == 'BUILD_IOS_PRODUCTION' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a private Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN; configure it before any potentially billable EAS build."
            exit 1
          fi

      - name: Check out the exact source validated above
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Authenticate with Expo and install EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Confirm the intended Expo account
        working-directory: mobile
        run: |
          ACCOUNT="$(eas whoami)"
          if [ "$ACCOUNT" != "bferrell514" ]; then
            echo "::error::Unexpected Expo account; refusing to request a build."
            exit 1
          fi

      - name: Install workspace dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Record exact source SHA for App Store traceability
        run: |
          echo "Validated source: ${{ needs.preflight.outputs.source_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Profile: production (TestFlight-capable build)" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow does not submit to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Request production iOS EAS build (no Apple submission)
        working-directory: mobile
        run: eas build --platform ios --profile production --non-interactive --no-wait
