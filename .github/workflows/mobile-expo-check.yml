name: Mobile Expo Check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mobile-expo-v0
    paths:
      - "mobile/**"
      - "src/game/**"
      - "src/deviceStore.ts"
      - "src/deviceStore.test.ts"
      - ".github/workflows/mobile-expo-check.yml"

jobs:
  mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install shared engine test dependencies
        run: npm ci

      - name: Run game and SecureStore regression tests
        run: npm test

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Typecheck native app
        working-directory: mobile
        run: npm run typecheck

      - name: Bundle iOS app
        working-directory: mobile
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Bundle Android app
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-android
