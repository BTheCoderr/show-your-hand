name: Online Player Safety Checks

on:
  push:
    branches:
      - feature/online-player-safety-20261014
    paths:
      - "src/**"
      - "mobile/**"
      - "supabase/migrations/**"
      - ".github/workflows/online-safety-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    name: Validate online report/block UI and web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked engine and web dependencies
        run: npm ci
      - name: Run game and online tests
        run: npm test
      - name: Build production web client
        run: npm run build
      - name: Validate edge game source sync
        run: npm run check:edge-sync
